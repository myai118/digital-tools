name: Deploy KLZ to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-klz-cloudflare.yml']
permissions:
  contents: read
concurrency:
  group: deploy-klz-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN under repository Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID under repository Actions secrets."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: cloudflare/klz-private-20261029
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build KLZ
        working-directory: cloudflare-klz
        env:
          KLZ_SOURCE_ROOT: ..
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Preserve dashboard Access configuration
        working-directory: cloudflare-klz
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='wrangler.jsonc';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.keep_vars=true;
          config.vars={};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          JS
      - name: Register workers.dev address if missing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/workers/subdomain'
          headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'}
          def call(method,body=None):
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  try:return json.loads(e.read())
                  except Exception:return {'success':False,'errors':[{'code':e.code,'message':'Cloudflare rejected request'}]}
          existing=call('GET')
          current=(existing.get('result') or {}).get('subdomain')
          if current:
              print('Existing workers.dev address retained: '+current)
          else:
              result=call('PUT',{'subdomain':'jjkwan118-klz'})
              if not result.get('success'):
                  print('::error::Cloudflare workers.dev registration failed: '+json.dumps(result.get('errors',[])))
                  raise SystemExit(1)
              print('Registered workers.dev address: '+result['result']['subdomain'])
          PY
      - name: Deploy protected KLZ Worker
        working-directory: cloudflare-klz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      - name: Check setup secret name without reading its value
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/workers/scripts/klz-monitor/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          bindings=(data.get('result') or {}).get('bindings',[])
          matches=[b for b in bindings if b.get('name')=='SETUP_KEY']
          print('SETUP_KEY installed: '+str(bool(matches)))
          if matches:print('SETUP_KEY binding type: '+str(matches[0].get('type')))
          print('Similar binding names: '+', '.join(b.get('name','') for b in bindings if 'SETUP' in b.get('name','').upper()))
          PY
      - name: Verify deployed login and protected data
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,time
          base='https://klz-monitor.jjkwan118-klz.workers.dev'
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(base+'/login',timeout=20) as r:
                      assert r.status==200 and 'Client accounts sign in' in r.read().decode()
                  with urllib.request.urlopen(base+'/tools-klz.html',timeout=20) as r:
                      assert '/login' in r.url and 'Client accounts sign in' in r.read().decode()
                  try:
                      urllib.request.urlopen(base+'/api/snapshot',timeout=20)
                      raise AssertionError('Unauthenticated data request was accepted')
                  except urllib.error.HTTPError as e:
                      assert e.code==401
                  print('Live login works; direct monitor access requires login; data endpoint rejects unauthenticated requests.')
                  break
              except urllib.error.HTTPError as e:
                  print('Live check failed at '+e.url+' status '+str(e.code))
                  print(e.read().decode(errors='replace')[:2000])
                  raise
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY

# Deploy individual accounts with private Durable Object storage.
