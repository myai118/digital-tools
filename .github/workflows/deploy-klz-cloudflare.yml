name: Deploy KLZ to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-klz-cloudflare.yml']
permissions:
  contents: read
concurrency:
  group: deploy-klz-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN under repository Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID under repository Actions secrets."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: cloudflare/klz-private-20261029
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build KLZ
        working-directory: cloudflare-klz
        env:
          KLZ_SOURCE_ROOT: ..
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Preserve dashboard Access configuration
        working-directory: cloudflare-klz
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='wrangler.jsonc';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.keep_vars=true;
          config.vars={};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          JS
      - name: Deploy protected KLZ Worker
        working-directory: cloudflare-klz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
