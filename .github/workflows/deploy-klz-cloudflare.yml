name: Deploy Client monitor to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-klz-cloudflare.yml']
permissions:
  contents: read
concurrency:
  group: deploy-klz-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN under repository Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID under repository Actions secrets."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: cloudflare/client-20261030
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build Client monitor
        working-directory: cloudflare-klz
        env:
          KLZ_SOURCE_ROOT: ..
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Preserve dashboard Access configuration
        working-directory: cloudflare-klz
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='wrangler.jsonc';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.keep_vars=true;
          config.vars={};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          JS
      - name: Check account hostname scope
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']
          headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:d=json.load(r)
              if not d.get('success'):raise RuntimeError('Cloudflare scope check failed')
              return d['result']
          scripts=get('/workers/scripts')
          unrelated=[s['id'] for s in scripts if s['id'] not in ['klz-monitor','client-monitor']]
          if unrelated:raise RuntimeError('Hostname change stopped: unrelated Workers exist: '+', '.join(unrelated))
          current=get('/workers/subdomain')['subdomain']
          if current not in ['jjkwan118-klz','myai118-client']:raise RuntimeError('Unexpected current subdomain; no change made')
          print('Hostname scope checked: '+current)
          PY
      - name: Deploy protected Client Worker
        working-directory: cloudflare-klz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      - name: Preserve account namespace and activate Client hostname
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']
          headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'}
          def call(path,method='GET',body=None):
              req=urllib.request.Request(base+path,headers=headers,method=method,data=None if body is None else json.dumps(body).encode())
              with urllib.request.urlopen(req,timeout=30) as r:d=json.load(r)
              if not d.get('success'):raise RuntimeError('Cloudflare operation failed: '+json.dumps(d.get('errors',[])))
              return d['result']
          def namespace(script):
              bindings=call('/workers/scripts/'+script+'/settings')['bindings']
              matches=[b for b in bindings if b.get('name')=='ACCOUNTS']
              if len(matches)!=1 or not matches[0].get('namespace_id'):raise RuntimeError('Cannot verify account namespace')
              return matches[0]['namespace_id']
          if namespace('klz-monitor')!=namespace('client-monitor'):raise RuntimeError('Account namespace mismatch; hostname not changed')
          print('Verified: Client monitor uses the existing account namespace.')
          desired='myai118-client'
          if call('/workers/subdomain')['subdomain']!=desired:
              result=call('/workers/subdomain','PUT',{'subdomain':desired})
              if result.get('subdomain')!=desired:raise RuntimeError('Hostname change was not confirmed')
          print('Client URL: https://client-monitor.myai118-client.workers.dev')
          PY
      - name: Check setup secret name without reading its value
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/workers/scripts/klz-monitor/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          bindings=(data.get('result') or {}).get('bindings',[])
          matches=[b for b in bindings if b.get('name')=='SETUP_KEY']
          print('SETUP_KEY installed: '+str(bool(matches)))
          if matches:print('SETUP_KEY binding type: '+str(matches[0].get('type')))
          print('Similar binding names: '+', '.join(b.get('name','') for b in bindings if 'SETUP' in b.get('name','').upper()))
          PY
      - name: Verify deployed login and protected data
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,time
          base='https://client-monitor.myai118-client.workers.dev'
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(base+'/login',timeout=20) as r:
                      assert r.status==200 and 'Client accounts sign in' in r.read().decode()
                  with urllib.request.urlopen(base+'/tools-klz.html',timeout=20) as r:
                      assert '/login' in r.url and 'Client accounts sign in' in r.read().decode()
                  try:
                      urllib.request.urlopen(base+'/api/snapshot',timeout=20)
                      raise AssertionError('Unauthenticated data request was accepted')
                  except urllib.error.HTTPError as e:
                      assert e.code==401
                  print('Live login works; direct monitor access requires login; data endpoint rejects unauthenticated requests.')
                  break
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  if e.code==403 and '1010' in body:
                      print('::warning::Cloudflare blocked the automated runner (1010). Deployment succeeded; browser verification is required.')
                      break
                  print('Live check failed at '+e.url+' status '+str(e.code))
                  raise
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY

# Deploy individual accounts with private Durable Object storage.
